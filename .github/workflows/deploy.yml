# .github/workflows/deploy.yml  (backend repo: myTradingAgentsBackend)
#
# Consolidated PM2 deployment:
#   • Packages the backend (excluding secrets, venv, data, logs, node_modules,
#     .pem keys) and uploads a versioned zip to S3.
#   • Optionally seeds .env to S3 from the APP_ENV_B64 repo secret.
#   • Uploads scripts/bootstrap.sh to S3 and runs it on the EC2 instance via
#     SSM (no SSH keys needed). bootstrap.sh does all on-instance work:
#     systemd→PM2 migration, .env ownership/permissions, TRADINGAGENTS model
#     name repair, PM2 + nginx + CloudWatch setup, and the /health check.

name: Deploy backend to S3 + EC2 (PM2)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-east-1
  BUCKET: s3general-148535751717-ap-east-1-an
  INSTANCE_ID: i-00c16218eb325facf
  SERVICE_NAME: mytradingagents-backend
  APP_ROOT: /opt/myTradingAgentsBackend

permissions:
  id-token: write   # needed for OIDC role assumption
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select AWS authentication mode
        id: aws_auth
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "${AWS_DEPLOY_ROLE_ARN:-}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          else
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.aws_auth.outputs.mode == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Preferred: OIDC role (no long-lived keys).
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys fallback)
        if: ${{ steps.aws_auth.outputs.mode == 'keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package backend
        run: |
          set -euo pipefail
          zip -r backend.zip . \
            -x '.git/*' '.github/*' '.venv/*' 'node_modules/*' \
               '**/__pycache__/*' '*.pyc' \
               'data/*' 'artifacts/*' 'logs/*' \
               '.env' '.env.bak' '*.pem' 'tests/*'
          unzip -l backend.zip | tail -n 5

      - name: Upload release to S3
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          aws s3 cp backend.zip "s3://${BUCKET}/releases/${SHA}/backend.zip"
          printf '%s' "${SHA}" > release.txt
          aws s3 cp release.txt "s3://${BUCKET}/current/release.txt"
          # Keep bootstrap.sh on S3 in sync with the repo copy.
          # The SSM step downloads it from S3 to stay within the 16 KB per-command limit.
          if [ ! -f scripts/bootstrap.sh ]; then
            echo "scripts/bootstrap.sh not found in workspace — cannot deploy" >&2
            exit 1
          fi
          aws s3 cp scripts/bootstrap.sh "s3://${BUCKET}/scripts/bootstrap.sh"

      - name: Seed .env to S3 config (if secret is available)
        env:
          APP_ENV_B64: ${{ secrets.APP_ENV_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${APP_ENV_B64:-}" ]; then
            echo "${APP_ENV_B64}" | base64 -d | aws s3 cp - "s3://${BUCKET}/config/.env"
            echo "Uploaded .env to s3://${BUCKET}/config/.env"
          else
            echo "APP_ENV_B64 secret not set; skipping .env upload (bootstrap will use existing S3 config or instance .env)"
          fi

      - name: Trigger deployment on EC2 via SSM
        id: ssm
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/ssm-commands.json
          import json
          import os
          import shlex

          # Download bootstrap.sh from S3 (already uploaded in the previous step).
          # Inlining via base64 exceeds the 16 KB per-command SSM limit when the
          # script grows beyond ~12 KB; fetching from S3 avoids that constraint.
          commands = [
              "set -euxo pipefail",
              f"export APP_ROOT={shlex.quote(os.environ['APP_ROOT'])}",
              f"export CODE_BUCKET={shlex.quote(os.environ['BUCKET'])}",
              f"export CONFIG_BUCKET={shlex.quote(os.environ['BUCKET'])}",
              f"export SERVICE_NAME={shlex.quote(os.environ['SERVICE_NAME'])}",
              f"export PM2_APP_NAME={shlex.quote(os.environ['SERVICE_NAME'])}",
              'aws s3 cp "s3://${CODE_BUCKET}/scripts/bootstrap.sh" /tmp/bootstrap.sh',
              "chmod +x /tmp/bootstrap.sh",
              "bash /tmp/bootstrap.sh",
          ]
          print(json.dumps({"commands": commands}))
          PY
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${GITHUB_SHA} (PM2)" \
            --parameters "file:///tmp/ssm-commands.json" \
            --query 'Command.CommandId' --output text)
          echo "command_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
          echo "SSM command: ${CMD_ID}"

      - name: Wait for deployment to finish
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.ssm.outputs.command_id }}"
          FAILED=0
          STATUS="Unknown"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "${CMD_ID}" --details \
              --query 'CommandInvocations[0].Status' --output text)
            echo "status: ${STATUS}"
            case "${STATUS}" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "deploy failed"; FAILED=1; break ;;
            esac
            sleep 10
          done
          aws ssm list-command-invocations --command-id "${CMD_ID}" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text || true
          if [ "${FAILED}" = "1" ] || [ "${STATUS}" != "Success" ]; then
            exit 1
          fi
