# Deploy the Trading Agent dashboard (frontend) to S3 + EC2
#
# What this does on every push to main:
#   1. Builds the app with Node output (NITRO_PRESET=node-server).
#   2. Zips the built site (.output) and uploads it to S3 under
#      frontend/releases/<commit>/.
#   3. Tells the EC2 instance (via SSM) to run scripts/bootstrap-frontend.sh,
#      which installs the new release and restarts the site service.
#
# One-time setup in GitHub repo Settings -> Secrets and variables -> Actions:
#   AWS_ACCESS_KEY_ID     = AWS access key for an IAM user with
#                           s3:PutObject/s3:GetObject on the bucket and
#                           ssm:SendCommand on the instance.
#   AWS_SECRET_ACCESS_KEY = Corresponding AWS secret access key.

# .github/workflows/deploy-frontend.yml
name: Deploy frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: ap-east-1
  S3_BUCKET: s3general-148535751717-ap-east-1-an
  EC2_INSTANCE_ID: i-00c16218eb325facf

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (Node server output)
        env:
          NITRO_PRESET: node-server
          VITE_API_BASE_URL: https://www.myfinance5051.com/api
          VITE_PUBLIC_ASSET_BASE_URL: https://www.myfinance5051.com/api
        run: bun run build

      - name: Package the build
        run: |
          zip -r frontend.zip .output package.json
          ls -lh frontend.zip

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build to S3
        run: |
          aws s3 cp frontend.zip \
            "s3://$S3_BUCKET/frontend/releases/${{ github.sha }}/frontend.zip"
          aws s3 cp scripts/bootstrap-frontend.sh \
            "s3://$S3_BUCKET/frontend/scripts/bootstrap-frontend.sh"
          echo "${{ github.sha }}" > release.txt
          aws s3 cp release.txt \
            "s3://$S3_BUCKET/frontend/current/release.txt"

      - name: Tell EC2 to install the new release
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --comment "Deploy frontend ${{ github.sha }}" \
            --parameters 'commands=["set -euo pipefail","aws s3 cp s3://'"$S3_BUCKET"'/frontend/scripts/bootstrap-frontend.sh /tmp/bootstrap-frontend.sh","chmod +x /tmp/bootstrap-frontend.sh","S3_BUCKET='"$S3_BUCKET"' RELEASE=${{ github.sha }} AWS_REGION='"$AWS_REGION"' /tmp/bootstrap-frontend.sh"]' \
            --query "Command.CommandId" --output text)

          echo "SSM command: $COMMAND_ID"

          OUTPUT=""
          STATUS="Pending"

          for attempt in $(seq 1 120); do
            if ! OUTPUT=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" 2>/dev/null); then
              echo "SSM command status unavailable (attempt $attempt/120)"
              sleep 5
              continue
            fi

            STATUS=$(echo "$OUTPUT" | jq -r .Status)

            if [ "$STATUS" = "Success" ]; then
              echo "$OUTPUT" | jq .
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelling" ]; then
              echo "$OUTPUT" | jq .
              echo "::error::SSM command failed with status: $STATUS"
              exit 1
            fi

            echo "SSM command status: $STATUS (attempt $attempt/120)"
            sleep 5
          done

          if [ -n "$OUTPUT" ]; then
            echo "$OUTPUT" | jq .
          fi
          echo "Last known status: $STATUS"
          echo "::error::SSM command did not finish within 10 minutes"
          exit 1